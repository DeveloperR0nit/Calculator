<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="contaier">
      <div class="calc-wrapper">
        <div class="top-line"></div>
        <div id="result"></div>
        <div class="row row-1">
          <div class="col-3">
            <button class="row-1-btn row-btn black-btn" id="pi">π</button>
          </div>
          <div class="col-3">
            <button class="row-1-btn row-btn black-btn" id="root">√</button>
          </div>
          <div class="col-3">
            <button class="row-1-btn row-btn black-btn" id="brac-o">(</button>
          </div>
          <div class="col-3">
            <button class="row-1-btn row-btn black-btn" id="brac-c">)</button>
          </div>
        </div>
        <div class="row row-2">
          <div class="col-3">
            <button class="row-2-btn grey-btn row-btn" id="Ac">Ac</button>
          </div>
          <div class="col-3">
            <button class="row-2-btn grey-btn row-btn" id="backspace">
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M6.53499 3H21C21.2652 3 21.5196 3.10536 21.7071 3.29289C21.8946 3.48043 22 3.73478 22 4V20C22 20.2652 21.8946 20.5196 21.7071 20.7071C21.5196 20.8946 21.2652 21 21 21H6.53499C6.3704 21 6.20835 20.9594 6.06321 20.8818C5.91807 20.8042 5.79434 20.6919 5.70299 20.555L0.369993 12.555C0.260354 12.3907 0.201843 12.1975 0.201843 12C0.201843 11.8025 0.260354 11.6093 0.369993 11.445L5.70299 3.445C5.79434 3.30808 5.91807 3.19583 6.06321 3.11821C6.20835 3.04058 6.3704 2.99998 6.53499 3ZM7.06999 5L2.40399 12L7.06999 19H20V5H7.06999ZM13 10.586L15.828 7.757L17.243 9.172L14.414 12L17.243 14.828L15.828 16.243L13 13.414L10.172 16.243L8.75699 14.828L11.586 12L8.75699 9.172L10.172 7.757L13 10.586Z"
                  fill="#A5A5A5"
                />
              </svg>
            </button>
          </div>
          <div class="col-3" id="div">
            <button class="row-2-btn blue-btn row-btn">/</button>
          </div>
          <div class="col-3" id="mul">
            <button class="row-2-btn blue-btn row-btn">
              <svg
                width="12"
                height="12"
                viewBox="0 0 12 12"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M10.5561 1.81915L12 4.37234L7.60428 6L12 7.59575L10.5241 10.2447L6.86631 7.34043L7.57219 12H4.58824L5.22995 7.34043L1.54011 10.3085L0 7.59575L4.36364 5.96809L0.0320855 4.37234L1.47594 1.78724L5.22995 4.65957L4.55615 0H7.57219L6.86631 4.65957L10.5561 1.81915Z"
                  fill="#339DFF"
                />
              </svg>
            </button>
          </div>
        </div>
        <div class="row row-3">
          <div class="col-3">
            <button class="row-btn black-btn row-3-btn" id="seven">7</button>
          </div>
          <div class="col-3">
            <button class="row-btn black-btn row-3-btn" id="eight">8</button>
          </div>
          <div class="col-3">
            <button class="row-btn black-btn row-3-btn" id="nine">9</button>
          </div>
          <div class="col-3">
            <button class="row-btn blue-btn row-3-btn" id="min">-</button>
          </div>
        </div>
        <div class="row row-main">
          <div class="col-9">
            <div class="row row-upper">
              <div class="col-4">
                <button class="row-btn row-btn-4 black-btn" id="four">4</button>
              </div>
              <div class="col-4">
                <button class="row-btn row-btn-4 black-btn" id="five">5</button>
              </div>
              <div class="col-4">
                <button class="row-btn row-btn-4 black-btn" id="six">6</button>
              </div>
            </div>
            <div class="row row-middle">
              <div class="col-4">
                <button class="row-btn row-btn-4 black-btn" id="one">1</button>
              </div>
              <div class="col-4">
                <button class="row-btn row-btn-4 black-btn" id="two">2</button>
              </div>
              <div class="col-4">
                <button class="row-btn row-btn-4 black-btn" id="three">3</button>
              </div>
            </div>
            <div class="row row-bottom">
              <div class="col-8">
                <button class="row-btn row-btn-4 black-btn" id="zero">0</button>
              </div>
              <div class="col-4">
                <button class="row-btn row-btn-4 black-btn" id="dot">.</button>
              </div>
            </div>
          </div>
          <div class="col-3">
            <button class="row-btn row-btn-side blue-btn" id="plus">+</button>
            <button class="row-btn row-btn-side blue-btn" id="equals">=</button>
          </div>
        </div>
        <div class="dynamic-lund">

        </div>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
